name: Release AgentOS via BRAT

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v0.1.2'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Resolve and validate release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release version must be strict vX.Y.Z semver: ${REQUESTED_VERSION}" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${REQUESTED_VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${REQUESTED_VERSION#v}" >> "${GITHUB_ENV}"

      - name: Check requested version matches manifest
        run: |
          node -e 'const m=require("./manifest.json"); if (m.version !== process.env.RELEASE_VERSION) throw new Error("requested version does not match manifest.json");'

      - name: Refuse an existing tag for manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to overwrite ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Verify complete distribution bundle
        run: node scripts/verify-distribution.mjs

      - name: Verify BRAT compatibility and previous-to-next upgrade
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
        run: node scripts/verify-brat-release.mjs

      - name: Require canonical Forgejo build/test attestation
        run: |
          set -euo pipefail
          test -f .github/forgejo-build-attestation.json
          node -e 'const a=require("./.github/forgejo-build-attestation.json"); for (const k of ["sourceRepo","sourceCommit","buildPassed","testsPassed","mobileCheckPassed"]) if (!a[k] || (k.endsWith("Passed") && a[k] !== true)) throw new Error("missing or false attestation field: "+k); if (a.pluginVersion !== process.env.RELEASE_VERSION) throw new Error("attestation version mismatch");'

      - name: Create release tag on the verified commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub Release with complete BRAT bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            manifest.json
            main.js
            styles.css
