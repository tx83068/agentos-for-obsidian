name: Release AgentOS via BRAT

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Verify complete distribution bundle
        run: node scripts/verify-distribution.mjs
      - name: Verify BRAT compatibility and previous-to-next upgrade
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-brat-release.mjs
      - name: Require canonical Forgejo build/test attestation
        run: |
          test -f .github/forgejo-build-attestation.json
          node -e 'const a=require("./.github/forgejo-build-attestation.json"); for (const k of ["sourceRepo","sourceCommit","buildPassed","testsPassed","mobileCheckPassed"]) if (!a[k] || (k.endsWith("Passed") && a[k] !== true)) throw new Error("missing or false attestation field: "+k)'
      - name: Create GitHub Release with complete BRAT bundle
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            manifest.json
            main.js
            styles.css
